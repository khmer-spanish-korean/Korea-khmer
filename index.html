<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>크메르어 종합 마스터 퀴즈 & 실생활 대사전</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #6366f1;
      --gold: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-sub: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    .khmer-font { font-family: 'Kantumruy Pro', 'Noto Sans Khmer', sans-serif; }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .flag-icon { font-size: 1.8rem; }

    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .btn-pill {
      background: var(--card-sub);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-pill:hover { background: var(--primary); border-color: var(--primary-light); }

    .tabs-row {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 4px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active { background: var(--primary); color: #fff; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(15, 23, 42, 0.4);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .stat-item { display: flex; flex-direction: column; gap: 2px; }
    .stat-label { font-size: 0.72rem; color: var(--text-muted); }
    .stat-val { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .stat-val.gold { color: var(--gold); }
    .stat-val.green { color: var(--success); }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      transition: width 0.3s ease;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .card-meta { display: flex; justify-content: space-between; align-items: center; }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 14px;
    }

    .word-display {
      text-align: center;
      padding: 15px 10px;
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .khmer-word {
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.25;
    }

    .pronunciation-box {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 24px;
    }

    .pron-text { font-size: 1.2rem; font-weight: 700; color: var(--gold); }

    .btn-speak-main {
      background: var(--primary);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    .options-grid { display: flex; flex-direction: column; gap: 12px; }

    .option-btn {
      background: var(--card-sub);
      border: 2px solid var(--border);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-btn:hover:not(.locked) {
      background: #475569;
      border-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .option-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .option-left { display: flex; align-items: center; gap: 12px; }

    .option-num {
      width: 28px;
      height: 28px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .option-meaning { font-size: 1.15rem; font-weight: 600; }

    .option-status-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      display: none;
    }

    .option-revealed-area {
      display: none;
      padding-top: 8px;
      margin-top: 6px;
      border-top: 1px dashed rgba(255, 255, 255, 0.15);
      animation: fadeIn 0.3s ease;
    }

    .revealed-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rev-word-group { display: flex; align-items: center; gap: 10px; }
    .rev-khmer { font-size: 1.35rem; font-weight: 700; color: #ffffff; line-height: 1; }
    .rev-pron { font-size: 0.95rem; font-weight: 600; color: var(--gold); }

    .btn-opt-tts {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .option-btn.correct { background: rgba(16, 185, 129, 0.18) !important; border-color: var(--success) !important; }
    .option-btn.correct .option-num { background: var(--success); color: #fff; }
    .option-btn.correct .option-status-badge { display: inline-block; background: var(--success); color: #fff; }

    .option-btn.wrong-chosen { background: rgba(239, 68, 68, 0.18) !important; border-color: var(--danger) !important; }
    .option-btn.wrong-chosen .option-num { background: var(--danger); color: #fff; }
    .option-btn.wrong-chosen .option-status-badge { display: inline-block; background: var(--danger); color: #fff; }

    .option-btn.distractor { opacity: 0.85; border-color: #475569; }
    .option-btn.locked { cursor: default; }

    .feedback-bar {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      animation: slideUp 0.3s ease;
    }

    .feedback-title { font-size: 1.05rem; font-weight: 700; }

    .btn-next-question {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--gold);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast-popup.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* 대형 단어장 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 900;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

    .modal-body {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vocab-search-input {
      width: 100%;
      background: var(--card-sub);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
    }

    .vocab-search-input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    .search-tags-hint {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .hint-chip {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .hint-chip:hover { color: var(--gold); border-color: var(--gold); }

    .vocab-list { display: flex; flex-direction: column; gap: 8px; }

    .vocab-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .type-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: #cbd5e1;
    }

    .type-noun { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #93c5fd; }
    .type-verb { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #6ee7b7; }
    .type-adj { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; color: #fde68a; }
    .type-expr { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: #e9d5ff; }

    /* 실시간 구글 번역 연동 박스 */
    .google-live-card {
      background: rgba(79, 70, 229, 0.15);
      border: 1px solid var(--primary-light);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
      margin-top: 6px;
    }

    .btn-google-translate {
      background: var(--primary);
      border: none;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 480px) {
      .khmer-word { font-size: 2.5rem; }
      .pron-text { font-size: 1.05rem; }
      .option-meaning { font-size: 1.02rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <div class="logo-area">
          <span class="flag-icon">🇰🇭</span>
          <h1 class="app-title">크메르어 종합 퀴즈 & 대사전</h1>
        </div>
        <div class="header-actions">
          <button class="btn-pill" id="btnAudioMode" title="발음 재생 모드 변경">
            <span id="audioModeIcon">🇰🇭</span>
            <span id="audioModeText">원어 발음</span>
          </button>
          <button class="btn-pill" id="btnTestSound">🔊 테스트</button>
          <button class="btn-pill" id="btnOpenVocab">📖 통합 사전</button>
        </div>
      </div>

      <div class="tabs-row">
        <button class="tab-btn active" data-mode="all">전체 믹스</button>
        <button class="tab-btn" data-mode="verb">동사 전용</button>
        <button class="tab-btn" data-mode="adj">형용사 전용</button>
        <button class="tab-btn" data-mode="wrong">오답 복습 (<span id="wrongCount">0</span>)</button>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-label">진행도</span>
          <span class="stat-val"><span id="statCurrent">1</span> / <span id="statTotal">1000</span></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">정답 / 풀이</span>
          <span class="stat-val green"><span id="statCorrect">0</span> / <span id="statSolved">0</span></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">정답률</span>
          <span class="stat-val" id="statRate">0%</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">연속 정답</span>
          <span class="stat-val gold">🔥 <span id="statCombo">0</span></span>
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </header>

    <main class="quiz-card">
      <div class="card-meta">
        <span class="category-badge" id="badgeCategory">동사 (Verb)</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">단축키 [1][2][3][4] 풀기 | [Space] 다음</span>
      </div>

      <div class="word-display">
        <div class="khmer-word khmer-font" id="displayKhmer">ញ៉ាំ</div>
        <div class="pronunciation-box">
          <span class="pron-text" id="displayPron">[냠]</span>
          <button class="btn-speak-main" id="btnMainSpeak" title="발음 듣기">🔊</button>
        </div>
      </div>

      <div class="options-grid" id="optionsContainer"></div>

      <div class="feedback-bar" id="feedbackBar">
        <div class="feedback-title" id="feedbackTitle"></div>
        <button class="btn-next-question" id="btnNext">
          다음 문제로 이동 ➔ (Enter / Space)
        </button>
      </div>
    </main>
  </div>

  <!-- 통합 사전 모달 -->
  <div class="modal-overlay" id="vocabModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">📖 크메르어 실생활 대사전 (<span id="totalDictCount">0</span>단어)</h3>
        <button class="modal-close" id="btnCloseVocab">&times;</button>
      </div>
      <div class="modal-body">
        <div class="search-filter-box">
          <input type="text" class="vocab-search-input" id="vocabSearch" placeholder="발음(냠, 끗루이, 끄발, 덥), 크메르어, 한국어 뜻 검색...">
          <div class="search-tags-hint">
            <span>빠른 태그:</span>
            <span class="hint-chip" onclick="quickSearch('숫자')">#숫자(1~10,만)</span>
            <span class="hint-chip" onclick="quickSearch('가족')">#가족/호칭</span>
            <span class="hint-chip" onclick="quickSearch('신체')">#신체부위</span>
            <span class="hint-chip" onclick="quickSearch('시간')">#시간/요일</span>
            <span class="hint-chip" onclick="quickSearch('간식')">#간식/음식</span>
            <span class="hint-chip" onclick="quickSearch('병원')">#병원/아픔</span>
            <span class="hint-chip" onclick="quickSearch('쇼핑')">#쇼핑/가격</span>
          </div>
        </div>
        <div class="vocab-list" id="vocabList"></div>
      </div>
    </div>
  </div>

  <div class="toast-popup" id="toastPopup">
    <span id="toastIcon">🔊</span>
    <span id="toastMsg">발음 재생 중...</span>
  </div>

  <script>
    /* ==========================================================================
       1. 퀴즈 출제용 핵심 어휘군
       ========================================================================== */
    const RAW_VOCAB = [
      { khmer: "ញ៉ាំ", pron: "냠", meaning: "먹다 (친근한 표현)", type: "동사" },
      { khmer: "ហូប", pron: "호웁", meaning: "먹다 (일반 표현)", type: "동사" },
      { khmer: "ពិសា", pron: "피싸", meaning: "드시다 / 음용하다 (존칭)", type: "동사" },
      { khmer: "ផឹក", pron: "팍", meaning: "마시다", type: "동사" },
      { khmer: "ទៅ", pron: "떠으", meaning: "가다", type: "동사" },
      { khmer: "មក", pron: "모옥", meaning: "오다", type: "동사" },
      { khmer: "ធ្វើ", pron: "트워", meaning: "하다 / 만들다", type: "동사" },
      { khmer: "មើល", pron: "머얼", meaning: "보다 / 구경하다", type: "동사" },
      { khmer: "ស្ដាប់", pron: "스답", meaning: "듣다", type: "동사" },
      { khmer: "និយាយ", pron: "니이지이", meaning: "말하다 / 이야기하다", type: "동사" },
      { khmer: "អាន", pron: "안", meaning: "읽다", type: "동사" },
      { khmer: "សរសេរ", pron: "써쎄", meaning: "쓰다 / 필기하다", type: "동사" },
      { khmer: "គេង", pron: "껭", meaning: "자다 / 잠들다", type: "동사" },
      { khmer: "ដេក", pron: "덱", meaning: "눕다 / 취침하다", type: "동사" },
      { khmer: "ភ្ញាក់", pron: "프냑", meaning: "깨어나다 / 일어나다", type: "동사" },
      { khmer: "ដើរ", pron: "다으", meaning: "걷다 / 산책하다", type: "동사" },

    /* 유니코드 완성형 한글 음절 조합 */
    function conjugateKoreanVerb(meaning, type) {
      return meaning.replace(/([가-힣]+)다/g, (match, stem) => {
        if (type === 'want') return stem + "고 싶다";
        if (type === 'ing') {
          const code = stem.charCodeAt(stem.length - 1);
          if (code >= 0xAC00 && code <= 0xD7A3 && (code - 0xAC00) % 28 === 8) {
            return stem.slice(0, -1) + String.fromCharCode(code - 8) + "는 중이다";
          }
          return stem + "는 중이다";
        }
        if (type === 'past') {
          if (stem.endsWith("하")) return stem.slice(0, -1) + "해본 적 있다";
          const code = stem.charCodeAt(stem.length - 1);
          if (code >= 0xAC00 && code <= 0xD7A3) {
            const jong = (code - 0xAC00) % 28;
            if (jong === 0) return stem.slice(0, -1) + String.fromCharCode(code + 4) + " 적 있다";
            if (jong === 8) return stem.slice(0, -1) + String.fromCharCode(code - 8 + 4) + " 적 있다";
            return stem + "은 적 있다";
          }
          return stem + "은 적 있다";
        }
        return match;
      });
    }

    /* 1,000문제 자동 생성기 */
    function build1000QuestionBank() {
      const bank = [];
      const prefixes = [
        { kh: "ចង់", pr: "쩡" },
        { kh: "មិន", pr: "먼" },
        { kh: "កំពុង", pr: "껌뽕" },
        { kh: "ធ្លាប់", pr: "틀로압" },
        { kh: "ណាស់", pr: "나아" },
        { kh: "ពេក", pr: "뻭" }
      ];

      RAW_VOCAB.forEach(item => {
        bank.push({ khmer: item.khmer, pron: item.pron, meaning: item.meaning, type: item.type });
      });

      let seed = 0;
      while (bank.length < 1000) {
        const base = RAW_VOCAB[seed % RAW_VOCAB.length];
        const p = prefixes[Math.floor(bank.length / RAW_VOCAB.length) % prefixes.length];
        let k, pr, m;

        if (base.type === "동사") {
          if (p.kh === "ចង់") {
            k = "ចង់" + base.khmer; pr = "쩡 " + base.pron; m = conjugateKoreanVerb(base.meaning, 'want');
          } else if (p.kh === "មិន") {
            k = "មិន" + base.khmer; pr = "먼 " + base.pron; m = "안 " + base.meaning;
          } else if (p.kh === "កំពុង") {
            k = "កំពុង" + base.khmer; pr = "껌뽕 " + base.pron; m = conjugateKoreanVerb(base.meaning, 'ing');
          } else {
            k = "ធ្លាប់" + base.khmer; pr = "틀로압 " + base.pron; m = conjugateKoreanVerb(base.meaning, 'past');
          }
        } else {
          if (seed % 2 === 0) {
            k = base.khmer + "ណាស់"; pr = base.pron + " 나아"; m = "매우 " + base.meaning;
          } else {
            k = base.khmer + "ពេក"; pr = base.pron + " 뻭"; m = "너무 " + base.meaning;
          }
        }
        bank.push({ khmer: k, pron: pr, meaning: m, type: base.type });
        seed++;
      }
      return bank;
    }

    const VOCAB_DATABASE = build1000QuestionBank();

    // 단어장 대사전 (중복 제거 통합)
    const MASTER_DICTIONARY = (() => {
      const map = new Map();
      [...EXTRA_DICTIONARY_WORDS, ...RAW_VOCAB, ...VOCAB_DATABASE].forEach(item => {
        if (!map.has(item.khmer)) {
          map.set(item.khmer, item);
        }
      });
      return Array.from(map.values());
    })();

    /* 한국어 발음 유연 검색 정규화 엔진 */
    function normalizeSearchKey(str) {
      if (!str) return '';
      return str.toLowerCase()
        .replace(/\s+/g, '')
        .replace(/[\[\]\(\)\/]/g, '')
        .replace(/빽/g, '뻭')
        .replace(/빼/g, '뻬')
        .replace(/애/g, '에')
        .replace(/개/g, '게')
        .replace(/배/g, '베')
        .replace(/새/g, '세')
        .replace(/재/g, '제')
        .replace(/채/g, '체')
        .replace(/태/g, '테')
        .replace(/패/g, '페')
        .replace(/쓰/g, '스')
        .replace(/뜨/g, '트')
        .replace(/끄/g, '크')
        .replace(/호웁/g, '홉');
    }

    /* 하이브리드 음성 엔진 */
    let audioMode = 'khmer';
    let currentAudioObj = null;

    function showToast(icon, text) {
      const toast = document.getElementById('toastPopup');
      document.getElementById('toastIcon').textContent = icon;
      document.getElementById('toastMsg').textContent = text;
      toast.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function playGoogleKhmerAudio(text) {
      return new Promise((resolve, reject) => {
        if (currentAudioObj) {
          currentAudioObj.pause();
          currentAudioObj = null;
        }
        const encoded = encodeURIComponent(text);
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=km&q=${encoded}`;
        const audio = new Audio(url);
        currentAudioObj = audio;

        let hasResolved = false;
        const timer = setTimeout(() => {
          if (!hasResolved) {
            audio.pause();
            reject(new Error("Audio timeout"));
          }
        }, 3000);

        audio.onplay = () => clearTimeout(timer);
        audio.onended = () => resolve();
        audio.onerror = (e) => { clearTimeout(timer); reject(e); };
        audio.play().catch(err => { clearTimeout(timer); reject(err); });
      });
    }

    function playKoreanSpeech(pronText) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) return resolve();
        window.speechSynthesis.cancel();
        const clean = pronText.replace(/[\[\]\(\)\/]/g, ' ').trim();
        const utt = new SpeechSynthesisUtterance(clean);
        utt.lang = 'ko-KR';
        utt.rate = 0.9;
        utt.onend = () => resolve();
        utt.onerror = () => resolve();
        window.speechSynthesis.speak(utt);
      });
    }

    async function playSmartSpeech(khmerText, pronText) {
      showToast('🔊', `[${khmerText} : ${pronText}] 재생 중...`);

      if (audioMode === 'korean') {
        await playKoreanSpeech(pronText);
        return;
      }

      if (audioMode === 'both') {
        try { await playGoogleKhmerAudio(khmerText); } catch (e) {}
        await new Promise(r => setTimeout(r, 200));
        await playKoreanSpeech(pronText);
        return;
      }

      try {
        await playGoogleKhmerAudio(khmerText);
      } catch (err) {
        showToast('🗣️', `기기 음성 대체: [${pronText}]`);
        await playKoreanSpeech(pronText);
      }
    }

    /* 퀴즈 로직 */
    let currentMode = 'all'; 
    let questionPool = [];
    let currentIndex = 0;
    let currentQuestion = null;
    let isAnswered = false;

    let solvedCount = 0;
    let correctCount = 0;
    let comboCount = 0;
    let wrongList = [];

    function loadSavedWrongs() {
      try {
        const saved = localStorage.getItem('khmer_quiz_wrongs');
        if (saved) wrongList = JSON.parse(saved);
      } catch (e) {}
      updateWrongBadge();
    }

    function saveWrongs() {
      try {
        localStorage.setItem('khmer_quiz_wrongs', JSON.stringify(wrongList));
      } catch (e) {}
      updateWrongBadge();
    }

    function updateWrongBadge() {
      document.getElementById('wrongCount').textContent = wrongList.length;
    }

    function initQuizPool() {
      if (currentMode === 'all') {
        questionPool = [...VOCAB_DATABASE];
      } else if (currentMode === 'verb') {
        questionPool = VOCAB_DATABASE.filter(v => v.type === '동사');
      } else if (currentMode === 'adj') {
        questionPool = VOCAB_DATABASE.filter(v => v.type === '형용사');
      } else if (currentMode === 'wrong') {
        if (wrongList.length === 0) {
          alert('틀린 문제가 아직 없습니다! 전체 모드에서 먼저 문제를 풀어보세요.');
          setMode('all');
          return;
        }
        questionPool = [...wrongList];
      }

      questionPool.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      updateStats();
      loadNextQuestion();
    }

    function loadNextQuestion() {
      if (currentIndex >= questionPool.length) {
        if (currentMode === 'wrong') {
          alert('🎉 오답 복습 1회 완주를 축하합니다!');
          setMode('all');
          return;
        } else {
          alert('🏆 대단합니다! 1,000문제를 모두 완주하셨습니다!');
          currentIndex = 0;
          questionPool.sort(() => Math.random() - 0.5);
        }
      }

      isAnswered = false;
      const targetWord = questionPool[currentIndex];

      const sameTypeVocab = VOCAB_DATABASE.filter(v => 
        v.type === targetWord.type && v.meaning !== targetWord.meaning
      );
      
      const shuffledDistractors = sameTypeVocab.sort(() => Math.random() - 0.5);
      const chosenDistractors = shuffledDistractors.slice(0, 3);
      const options = [targetWord, ...chosenDistractors].sort(() => Math.random() - 0.5);

      currentQuestion = { target: targetWord, options: options };
      renderQuestionCard();
    }

    function renderQuestionCard() {
      const q = currentQuestion;

      document.getElementById('badgeCategory').textContent = `${q.target.type} (${q.target.type === '동사' ? 'Verb' : 'Adjective'})`;
      document.getElementById('displayKhmer').textContent = q.target.khmer;
      document.getElementById('displayPron').textContent = `[${q.target.pron}]`;

      document.getElementById('btnMainSpeak').onclick = () => {
        playSmartSpeech(q.target.khmer, q.target.pron);
      };

      document.getElementById('feedbackBar').style.display = 'none';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.id = `optBtn_${idx}`;

        btn.innerHTML = `
          <div class="option-main-row">
            <div class="option-left">
              <span class="option-num">${idx + 1}</span>
              <span class="option-meaning">${opt.meaning}</span>
            </div>
            <span class="option-status-badge" id="optBadge_${idx}"></span>
          </div>

          <div class="option-revealed-area" id="revArea_${idx}">
            <div class="revealed-content">
              <div class="rev-word-group">
                <span class="rev-khmer khmer-font">${opt.khmer}</span>
                <span class="rev-pron">[${opt.pron}]</span>
              </div>
              <button class="btn-opt-tts" id="btnTts_${idx}">
                🔊 발음 듣기
              </button>
            </div>
          </div>
        `;

        btn.onclick = () => {
          if (!isAnswered) checkAnswer(idx, opt);
        };

        setTimeout(() => {
          const ttsBtn = document.getElementById(`btnTts_${idx}`);
          if (ttsBtn) {
            ttsBtn.onclick = (e) => {
              e.stopPropagation();
              playSmartSpeech(opt.khmer, opt.pron);
            };
          }
        }, 0);

        container.appendChild(btn);
      });

      updateStats();
    }

    function checkAnswer(chosenIndex, chosenOption) {
      if (isAnswered) return;
      isAnswered = true;

      solvedCount++;
      const isCorrect = (chosenOption.meaning === currentQuestion.target.meaning);

      if (isCorrect) {
        correctCount++;
        comboCount++;
        wrongList = wrongList.filter(w => w.khmer !== currentQuestion.target.khmer);
        saveWrongs();
      } else {
        comboCount = 0;
        if (!wrongList.some(w => w.khmer === currentQuestion.target.khmer)) {
          wrongList.push(currentQuestion.target);
          saveWrongs();
        }
      }

      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.getElementById(`optBtn_${idx}`);
        const badge = document.getElementById(`optBadge_${idx}`);
        const revArea = document.getElementById(`revArea_${idx}`);

        btn.classList.add('locked');
        revArea.style.display = 'block';

        if (opt.meaning === currentQuestion.target.meaning) {
          btn.classList.add('correct');
          badge.textContent = '✓ 정답';
        } else if (idx === chosenIndex) {
          btn.classList.add('wrong-chosen');
          badge.textContent = '✗ 내가 고른 답';
        } else {
          btn.classList.add('distractor');
        }
      });

      const feedbackBar = document.getElementById('feedbackBar');
      const feedbackTitle = document.getElementById('feedbackTitle');

      if (isCorrect) {
        feedbackTitle.innerHTML = `<span style="color:var(--success);">🎉 정답입니다! (+1점, 연속 ${comboCount}회 달성)</span>`;
        playSmartSpeech(currentQuestion.target.khmer, currentQuestion.target.pron);
      } else {
        feedbackTitle.innerHTML = `<span style="color:var(--danger);">😢 아쉽습니다! 정답은 [${currentQuestion.target.meaning}] 입니다.</span>`;
      }

      feedbackBar.style.display = 'flex';
      updateStats();
    }

    function goNext() {
      currentIndex++;
      loadNextQuestion();
    }

    function updateStats() {
      document.getElementById('statCurrent').textContent = Math.min(currentIndex + 1, questionPool.length);
      document.getElementById('statTotal').textContent = questionPool.length;
      document.getElementById('statSolved').textContent = solvedCount;
      document.getElementById('statCorrect').textContent = correctCount;
      document.getElementById('statCombo').textContent = comboCount;

      const rate = solvedCount > 0 ? Math.round((correctCount / solvedCount) * 100) : 0;
      document.getElementById('statRate').textContent = `${rate}%`;

      const progressPercent = questionPool.length > 0 ? ((currentIndex) / questionPool.length) * 100 : 0;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      initQuizPool();
    }

    /* 단어장 렌더링 & 실시간 구글 번역 연동 */
    function renderVocabList(rawQuery = '') {
      const container = document.getElementById('vocabList');
      container.innerHTML = '';

      const query = rawQuery.trim();
      const normQuery = normalizeSearchKey(query);

      let filtered = [];

      if (!query) {
        filtered = MASTER_DICTIONARY.slice(0, 80);
      } else {
        filtered = MASTER_DICTIONARY.filter(item => {
          const itemKhmer = item.khmer;
          const itemPronNorm = normalizeSearchKey(item.pron);
          const itemMeanNorm = normalizeSearchKey(item.meaning);
          const itemTypeNorm = normalizeSearchKey(item.type);

          if (itemKhmer.includes(query)) return true;
          if (itemPronNorm.includes(normQuery)) return true;
          if (itemMeanNorm.includes(normQuery)) return true;
          if (itemTypeNorm.includes(normQuery)) return true;

          return false;
        });
      }

      // 사전에 없을 때 구글 번역기 실시간 검색 버튼 노출
      if (filtered.length === 0 && query) {
        const isKhmer = /[\u1780-\u17FF]/.test(query);
        const sl = isKhmer ? 'km' : 'ko';
        const tl = isKhmer ? 'ko' : 'km';
        const googleUrl = `https://translate.google.com/?sl=${sl}&tl=${tl}&text=${encodeURIComponent(query)}&op=translate`;

        container.innerHTML = `
          <div class="google-live-card">
            <div style="font-size: 0.95rem; font-weight: 700;">내장 사전에 없는 단어입니다</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">아래 버튼을 눌러 구글 실시간 번역으로 바로 확인하세요:</div>
            <a href="${googleUrl}" target="_blank" class="btn-google-translate">
              🌐 구글 번역기에서 "${query}" 실시간 검색하기 ➔
            </a>
          </div>
        `;
        return;
      }

      filtered.forEach(item => {
        const row = document.createElement('div');
        row.className = 'vocab-row';

        let typeClass = 'type-badge';
        if (item.type.includes('명사') || item.type.includes('간식') || item.type.includes('음식') || item.type.includes('과일') || item.type.includes('숫자')) typeClass += ' type-noun';
        else if (item.type.includes('동사')) typeClass += ' type-verb';
        else if (item.type.includes('형용사')) typeClass += ' type-adj';
        else typeClass += ' type-expr';

        row.innerHTML = `
          <div>
            <div style="display:flex; align-items:center; gap:8px;">
              <span class="khmer-font" style="font-size:1.3rem; font-weight:700;">${item.khmer}</span>
              <span style="color:var(--gold); font-size:0.95rem; font-weight:600;">[${item.pron}]</span>
              <span class="${typeClass}">${item.type}</span>
            </div>
            <div style="font-size:0.95rem; color:#f1f5f9; margin-top:3px;">${item.meaning}</div>
          </div>
          <button class="btn-opt-tts" onclick="playSmartSpeech('${item.khmer}', '${item.pron}')">
            🔊 듣기
          </button>
        `;
        container.appendChild(row);
      });
    }

    function quickSearch(word) {
      const input = document.getElementById('vocabSearch');
      input.value = word;
      renderVocabList(word);
      input.focus();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('totalDictCount').textContent = MASTER_DICTIONARY.length;
      loadSavedWrongs();
      initQuizPool();

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => setMode(btn.dataset.mode);
      });

      document.getElementById('btnNext').onclick = goNext;

      document.getElementById('btnAudioMode').onclick = () => {
        if (audioMode === 'khmer') {
          audioMode = 'korean';
          document.getElementById('audioModeIcon').textContent = '🗣️';
          document.getElementById('audioModeText').textContent = '한글 독음';
          showToast('🗣️', '한글 독음 읽기 모드');
        } else if (audioMode === 'korean') {
          audioMode = 'both';
          document.getElementById('audioModeIcon').textContent = '🔄';
          document.getElementById('audioModeText').textContent = '연속 듣기';
          showToast('🔄', '원어 + 한글 독음 연속 재생');
        } else {
          audioMode = 'khmer';
          document.getElementById('audioModeIcon').textContent = '🇰🇭';
          document.getElementById('audioModeText').textContent = '원어 발음';
          showToast('🇰🇭', '원어 발음 모드');
        }
      };

      document.getElementById('btnTestSound').onclick = () => {
        playSmartSpeech("សួស្តី", "쑤어싸데이 (안녕하세요)");
      };

      const vocabModal = document.getElementById('vocabModal');
      document.getElementById('btnOpenVocab').onclick = () => {
        vocabModal.classList.add('open');
        renderVocabList(document.getElementById('vocabSearch').value);
      };
      document.getElementById('btnCloseVocab').onclick = () => {
        vocabModal.classList.remove('open');
      };
      document.getElementById('vocabSearch').oninput = (e) => {
        renderVocabList(e.target.value);
      };

      window.addEventListener('keydown', (e) => {
        if (vocabModal.classList.contains('open')) return;

        if (!isAnswered) {
          if (['1', '2', '3', '4'].includes(e.key)) {
            const idx = parseInt(e.key) - 1;
            if (currentQuestion && currentQuestion.options[idx]) {
              checkAnswer(idx, currentQuestion.options[idx]);
            }
          }
        } else {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            goNext();
          }
        }
      });
    });
  </script>
</body>
</html>
